<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AsistenciaPro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #1e293b; }
    .card { background: #fff; border-radius: 16px; padding: 48px 32px; text-align: center; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; font-size: 14px; }
    a { display: inline-block; background: #059669; color: #fff; padding: 12px 32px; border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 15px; transition: background .2s; }
    a:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📋</div>
    <h1>AsistenciaPro</h1>
    <p>La página que buscas no existe. Regresa al inicio para continuar.</p>
    <a href="./">Ir al Inicio</a>
  </div>
  <script>
    // Auto-redirect after 3 seconds
    setTimeout(() => window.location.href = './', 3000);
  </script>
</body>
</html>
