# ============================================================
# Despliegue automático a GitHub Pages
# Se ejecuta con cada push a la rama `main` (o manualmente
# desde la pestaña Actions).
#
# La app es un sitio estático autocontenido (index.html con
# CSS y JS embebidos), así que "construir" solo significa
# copiar los archivos al artefacto que publica Pages.
# ============================================================
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar el sitio (artefacto)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          exclude: |
            .github
            .freebuff
            .git

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
